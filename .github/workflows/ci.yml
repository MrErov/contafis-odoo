name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    name: Backend tests (Odoo + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare addons
        run: |
          mkdir -p /tmp/extra-addons
          cp -r addons/l10n_ve_compliance_manager /tmp/extra-addons/

      - name: Run Odoo tests
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network host \
            -v /tmp/extra-addons:/mnt/extra-addons \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            odoo:19.0 \
            odoo -d test_ci \
              -i l10n_ve_compliance_manager \
              --test-tags /l10n_ve_compliance_manager \
              --test-enable \
              --stop-after-init \
              --no-http \
              --workers=0 \
              --log-level=test 2>&1 | tee /tmp/odoo_test.log
          grep -E "tests when|failed" /tmp/odoo_test.log || true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-test-log
          path: /tmp/odoo_test.log
