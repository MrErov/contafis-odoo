name: CI

# Principios de la skill de CI/CD traducidos a Python/Odoo:
#   - Shift Left: los gates baratos (ruff, pre-commit) corren antes de la suite.
#   - Quality gates: lint y tests fallan el workflow, no solo avisan.
#   - Only run what changed: docs/ y Markdown no disparan la pipeline.
#
# Los tests del módulo son TransactionCase de Odoo (no pytest): requieren el
# runtime completo y una base PostgreSQL real, por eso se ejecutan con
# `odoo --test-enable` dentro de la imagen oficial.

on:
  push:
    branches: [19.0]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [19.0]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  ODOO_IMAGE: 'odoo:19.0'

jobs:
  quality:
    name: Quality gates (ruff + pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install linters
        run: pip install --disable-pip-version-check ruff pre-commit

      # Gate explícito de lint sin auto-fix: en CI no se reescribe el código.
      - name: Ruff (lint)
        run: ruff check addons/l10n_ve_compliance_manager

      # mypy se omite a propósito: el repo no tiene configuración de mypy ni
      # stubs de tipos para el ORM de Odoo 19. Activarlo daría falsos positivos.
      - name: Pre-commit (YAML, XML, whitespace, ruff)
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Odoo tests (PostgreSQL 15)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          # Nunca hardcodear el password: se configura como secret del repo.
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare addons
        run: |
          mkdir -p /tmp/extra-addons
          cp -r addons/l10n_ve_compliance_manager /tmp/extra-addons/

      - name: Run Odoo test suite
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          set -o pipefail
          docker run --rm --network host \
            -v /tmp/extra-addons:/mnt/extra-addons \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD="$PGPASSWORD" \
            -e PYTHONUNBUFFERED=1 \
            "$ODOO_IMAGE" \
            odoo -d test_ci \
              -i l10n_ve_compliance_manager \
              --test-tags /l10n_ve_compliance_manager \
              --test-enable \
              --stop-after-init \
              --no-http \
              --workers=0 \
              --log-level=info \
            2>&1 | tee /tmp/odoo_test.log

          # Fuente de verdad del conteo: la línea que imprime Odoo.
          # Se exige N > 0 para que un run sin tests no pase en verde.
          RESULT_LINE=$(grep -E "0 failed, 0 error\(s\) of [1-9][0-9]* tests" /tmp/odoo_test.log | tail -1 || true)
          if [ -z "$RESULT_LINE" ]; then
            echo "::error::No se encontró '0 failed, 0 error(s) of N tests' con N > 0"
            echo "=== Últimas 100 líneas del log ==="
            tail -100 /tmp/odoo_test.log
            exit 1
          fi
          echo "::notice::$RESULT_LINE"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-test-log
          path: /tmp/odoo_test.log
          if-no-files-found: warn

  # build: OMITIDO a propósito.
  #   - Este repo no tiene Dockerfile propio; usa la imagen oficial odoo:19.0.
  #   - docker-compose.prod.yml construye `assistant` desde ../contafis-assistant,
  #     repo hermano que no existe en el checkout de GitHub Actions.
  # Cuando exista un Dockerfile del módulo, agregar aquí `docker build`.
