name: CI

on:
  push:
    branches: [main, 19.0]
  pull_request:
    branches: [main, 19.0]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    name: Backend tests (Odoo + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare addons
        run: |
          mkdir -p /tmp/extra-addons
          cp -r addons/l10n_ve_compliance_manager /tmp/extra-addons/

      - name: Run Odoo tests
        shell: bash
        run: |
          # Run Odoo tests - ignore Docker exit code (Odoo exits 1 on demo data warnings)
          # Tests pass if log contains test success indicators
          # Use --log-level=info (not 'test') to ensure test results are logged
          # Force fully unbuffered I/O to ensure test output is written to log immediately
          echo "Starting Odoo tests..."
          docker run --rm --network host \
            -v /tmp/extra-addons:/mnt/extra-addons \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -e PYTHONUNBUFFERED=1 \
            odoo:19.0 \
            stdbuf -o0 -e0 \
            odoo -d test_ci \
              -i l10n_ve_compliance_manager \
              --test-tags /l10n_ve_compliance_manager \
              --test-enable \
              --stop-after-init \
              --no-http \
              --workers=0 \
              --log-level=info 2>&1 | tee /tmp/odoo_test.log
          DOCKER_EXIT=${PIPESTATUS[0]}
          echo "=== DEBUG: Docker exit code: $DOCKER_EXIT ==="
          echo "=== DEBUG: Log file size: $(wc -c /tmp/odoo_test.log) ==="
          echo "=== DEBUG: Searching for success patterns ==="
          grep -n -i "0 failed" /tmp/odoo_test.log && echo "FOUND: '0 failed' (case-insensitive)" || echo "NOT FOUND: '0 failed' (case-insensitive)"
          grep -n "tests when" /tmp/odoo_test.log && echo "FOUND: 'tests when'" || echo "NOT FOUND: 'tests when'"
          grep -n -i "0 error" /tmp/odoo_test.log && echo "FOUND: '0 error' (case-insensitive)" || echo "NOT FOUND: '0 error' (case-insensitive)"
          grep -n "odoo.tests.result" /tmp/odoo_test.log && echo "FOUND: 'odoo.tests.result'" || echo "NOT FOUND: 'odoo.tests.result'"
          echo "=== DEBUG: Searching for 'failed' (case-insensitive) ==="
          grep -n -i "failed" /tmp/odoo_test.log | tail -10
          echo "=== DEBUG: Searching for 'error' (case-insensitive) ==="
          grep -n -i "error" /tmp/odoo_test.log | tail -10
          echo "=== DEBUG: Last 500 lines of log ==="
          tail -500 /tmp/odoo_test.log
          # Check if tests passed - Odoo standard pattern: "0 failed, 0 error(s) of N tests"
          if grep -qE "0 failed, 0 error\(s\) of [0-9]+ tests" /tmp/odoo_test.log; then
            echo "Tests passed (standard Odoo success pattern matched)"
            exit 0
          fi
          # Fallback: check for "0 failed, 0 error" pattern
          if grep -qE "0 failed, 0 error\(s\) of [0-9]+ tests" /tmp/odoo_test.log; then
            echo "Tests passed (pattern matched)"
            exit 0
          fi
          # Fallback: check for "0 failed, 0 error(s) of N tests" in any case
          if grep -qiE "0 failed, 0 error\(s\) of [0-9]+ tests" /tmp/odoo_test.log; then
            echo "Tests passed (case-insensitive pattern matched)"
            exit 0
          fi
          # Fallback: check for "0 failed, 0 error(s) of" pattern
          if grep -qiE "0 failed, 0 error\(s\) of [0-9]+ tests" /tmp/odoo_test.log; then
            echo "Tests passed (case-insensitive pattern matched)"
            exit 0
          fi
          # Show debug info before failing
          echo "=== DEBUG: Pattern not found, showing full log ==="
          cat /tmp/odoo_test.log
          exit 1

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-test-log
          path: /tmp/odoo_test.log

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare addons
        run: |
          mkdir -p /tmp/extra-addons
          cp -r addons/l10n_ve_compliance_manager /tmp/extra-addons/

      - name: Start Odoo (daemon, HTTP enabled)
        run: |
          docker run -d --name odoo_e2e --network host \
            -v /tmp/extra-addons:/mnt/extra-addons \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            odoo:19.0 \
            odoo -d test_ci_e2e \
              -i l10n_ve_compliance_manager \
              --workers=0 \
              --log-level=info

      - name: Wait for Odoo HTTP and module install
        run: |
          for i in $(seq 1 40); do
            if curl -sSf http://localhost:8069/web/login > /dev/null 2>&1 \
               && docker logs odoo_e2e 2>&1 | grep -q "Modules loaded"; then
              echo "Odoo ready after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "Odoo did not become ready in 200s"
          docker logs odoo_e2e || true
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          ODOO_URL: http://localhost:8069
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright test-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/

      - name: Dump Odoo E2E log
        if: always()
        run: docker logs odoo_e2e > /tmp/odoo_e2e.log 2>&1 || true

      - name: Upload Odoo E2E log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-e2e-log
          path: /tmp/odoo_e2e.log
          if-no-files-found: warn

      - name: Stop Odoo
        if: always()
        run: docker stop odoo_e2e || true
