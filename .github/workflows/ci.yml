name: CI

on:
  push:
    branches: [main, 19.0]
  pull_request:
    branches: [main, 19.0]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    name: Backend tests (Odoo + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare addons
        run: |
          mkdir -p /tmp/extra-addons
          cp -r addons/l10n_ve_compliance_manager /tmp/extra-addons/

      - name: Run Odoo tests
        shell: bash
        run: |
          # Run Odoo tests and capture output to log file
          # Use the exact Odoo test result pattern: "0 failed, 0 error(s) of N tests"
          echo "Starting Odoo tests..."
          docker run --rm --network host \
            -v /tmp/extra-addons:/mnt/extra-addons \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -e PYTHONUNBUFFERED=1 \
            odoo:19.0 \
            odoo -d test_ci \
              -i l10n_ve_compliance_manager \
              --test-tags /l10n_ve_compliance_manager \
              --test-enable \
              --stop-after-init \
              --no-http \
              --workers=0 \
              --log-level=info \
              2>&1 | tee /tmp/odoo_test.log
          DOCKER_EXIT=${PIPESTATUS[0]}

          echo "=== Odoo test log saved to /tmp/odoo_test.log ==="
          echo "=== Docker exit code: $DOCKER_EXIT ==="

          # Search for the exact Odoo test success pattern
          if grep -q "0 failed, 0 error(s) of" /tmp/odoo_test.log; then
            echo "=== TESTS PASSED: Found '0 failed, 0 error(s) of N tests' ==="
            exit 0
          fi

          # Fallback: check for other success patterns
          if grep -q "0 failed, 0 error" /tmp/odoo_test.log; then
            echo "Tests passed (found '0 failed, 0 error')"
            exit 0
          fi

          # If no success pattern found, show relevant log lines and fail
          echo "=== TESTS FAILED: Could not find success pattern ==="
          echo "=== Searching for test result patterns ==="
          grep -i "failed\|error\|passed\|tests" /tmp/odoo_test.log | head -30 || true
          echo "=== Last 100 lines of log ==="
          tail -100 /tmp/odoo_test.log

          exit 1

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-test-log
          path: /tmp/odoo_test.log

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare addons
        run: |
          mkdir -p /tmp/extra-addons
          cp -r addons/l10n_ve_compliance_manager /tmp/extra-addons/

      - name: Start Odoo (daemon, HTTP enabled)
        run: |
          docker run -d --name odoo_e2e --network host \
            -v /tmp/extra-addons:/mnt/extra-addons \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -e ODOO_LONGPOLLING_PORT=8069 \
            odoo:19.0 \
            odoo -d test_ci_e2e \
              -i l10n_ve_compliance_manager \
              --workers=0 \
              --log-level=info

      - name: Wait for Odoo HTTP and module install
        run: |
          for i in $(seq 1 40); do
            if curl -sSf http://localhost:8069/web/login > /dev/null 2>&1 \
               && docker logs odoo_e2e 2>&1 | grep -q "Modules loaded"; then
              echo "Odoo ready after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "Odoo did not become ready in 200s"
          docker logs odoo_e2e || true
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          ODOO_URL: http://localhost:8069
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright test-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/

      - name: Dump Odoo E2E log
        if: always()
        run: docker logs odoo_e2e > /tmp/odoo_e2e.log 2>&1 || true

      - name: Upload Odoo E2E log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-e2e-log
          path: /tmp/odoo_e2e.log
          if-no-files-found: warn

      - name: Stop Odoo
        if: always()
        run: docker stop odoo_e2e || true
