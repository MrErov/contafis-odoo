# Reverse proxy de producción para ContaFis (docker-compose.prod.yml).
#
# Estado inicial: HTTP activo en :80 (necesario para el challenge ACME).
# TLS: emitir el certificado con certbot usando el webroot /var/www/certbot y
# luego descomentar el bloque `server { listen 443 ssl; ... }`.
#
# Solo nginx está publicado al host; odoo/assistant/chromadb viven en la red
# interna `contafis_net`.

upstream odoo_http {
    server odoo:8069;
}

upstream odoo_websocket {
    server odoo:8072;
}

upstream assistant_api {
    server assistant:8000;
}

server {
    listen 80;
    server_name _;

    # Lote de digitalización: hasta 20 recibos de 5 MB.
    client_max_body_size 200m;

    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    proxy_read_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Certbot (webroot) para emitir/renovar el certificado Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck interno de nginx (usado por docker-compose.prod.yml).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cuando TLS esté activo, redirigir todo el tráfico HTTP a HTTPS.
    # Descomentar la siguiente línea y el bloque 443 de abajo:
    # return 301 https://$host$request_uri;

    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # El assistant se consume internamente desde Odoo (Discuss). Si se necesita
    # exponerlo al público, descomentar este bloque (mantiene la API key).
    # location /assistant/ {
    #     proxy_pass http://assistant_api/;
    #     proxy_http_version 1.1;
    # }

    location / {
        proxy_pass http://odoo_http;
        proxy_http_version 1.1;
    }
}

