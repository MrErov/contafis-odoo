# Reverse proxy for local development: same origin for HTTP and WebSocket.
# Odoo 19's web client hardcodes the WebSocket URL to window.origin + /websocket,
# so /websocket must be routed to the gevent port (8072) on the same origin.
upstream odoo_http {
    server web:8069;
}

upstream odoo_websocket {
    server web:8072;
}

server {
    listen 80;
    server_name _;

    # Batch digitize uploads up to 20 receipts of 5 MB each.
    client_max_body_size 200m;

    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    proxy_read_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://odoo_http;
        proxy_http_version 1.1;
    }
}
