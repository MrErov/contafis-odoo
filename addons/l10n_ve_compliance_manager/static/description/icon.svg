<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo púrpura -->
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B34D1" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <!-- Clip Path para los bordes redondeados del contenedor base -->
    <clipPath id="baseCardClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Sombra suave para el escudo central -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E0A45" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Contenedor Base del Ícono de la App -->
  <g clip-path="url(#baseCardClip)">
    <!-- Fondo Púrpura -->
    <rect x="0" y="0" width="512" height="512" fill="url(#purpleBg)" />

    <!-- Escudo Blanco Central con Sombra -->
    <g filter="url(#shieldShadow)">
      <!-- Forma del Escudo -->
      <path d="M 256 75
               C 310 98, 360 118, 412 128
               C 412 250, 395 345, 256 422
               C 117 345, 100 250, 100 128
               C 152 118, 202 98, 256 75 Z" fill="#FAFAFC" />

      <!-- Checkmark Púrpura Perfecto y Centrado -->
      <path d="M 190 252 L 238 300 L 322 195" fill="none" stroke="#6D28D9" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Bandas Tricolor Inferiores -->
    <rect x="0" y="445" width="512" height="22" fill="#FACC15" />
    <rect x="0" y="467" width="512" height="22" fill="#2563EB" />
    <rect x="0" y="489" width="512" height="23" fill="#DC2626" />
  </g>
</svg>
